<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0b0b">
<title>BERNARD KY</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0b0b0b;
    color: #ffffff;
    font-family: Arial, sans-serif;
}

header {
    padding: 30px 16px 24px;
    text-align: center;
    border-bottom: 1px solid #aa843b;
}

header h1 {
    margin: 0;
    color: #d9b45b;
    font-size: 28px;
    letter-spacing: 4px;
}

header p {
    color: #c8c8c8;
    font-size: 12px;
    letter-spacing: 2px;
}

main {
    padding: 18px 12px;
}

h2 {
    color: #d9b45b;
    font-size: 17px;
    margin-bottom: 18px;
}

.gallery {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
}

.photo {
    overflow: hidden;
    border: 1px solid #8d7135;
    border-radius: 9px;
    background: #171717;
}

.photo img {
    display: block;
    width: 100%;
    height: 220px;
    object-fit: cover;
    cursor: pointer;
}

.photo p {
    margin: 0;
    padding: 10px 5px;
    text-align: center;
    color: #d9b45b;
    font-size: 12px;
}

.viewer {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 10;
    background: rgba(0, 0, 0, 0.96);
    align-items: center;
    justify-content: center;
    padding: 16px;
}

.viewer img {
    max-width: 100%;
    max-height: 85vh;
    object-fit: contain;
}

.close {
    position: absolute;
    top: 18px;
    right: 20px;
    color: #d9b45b;
    font-size: 36px;
    cursor: pointer;
}

footer {
    padding: 24px 10px;
    text-align: center;
    color: #999;
    font-size: 12px;
}
</style>
</head>

<body>

<header>
    <h1>BERNARD KY</h1>
    <p>GALERIE PERSONNELLE</p>
</header>

<main>
    <h2>MES PHOTOS</h2>

    <section class="gallery" id="gallery"></section>
</main>

<div class="viewer" id="viewer" onclick="closePhoto()">
    <span class="close">&times;</span>
    <img id="largePhoto" alt="Photo agrandie">
</div>

<footer>
    © BERNARD KY — Galerie personnelle
</footer>

<script>
const photos = [
    "1746055406887.jpg",
    "20250303_060327.jpg",
    "BeautyPlus_20191002114735_save.jpg",
    "BeautyPlus_20240504224809_save.jpg",
    "BeautyPlus_20240506225343_save.jpg"
];

const gallery = document.getElementById("gallery");

photos.forEach((photo, index) => {
    const card = document.createElement("article");
    card.className = "photo";

    const img = document.createElement("img");
    img.src = "photos/" + photo;
    img.alt = "Photo personnelle " + (index + 1);
    img.loading = "lazy";

    img.onclick = () => {
        document.getElementById("largePhoto").src = img.src;
        document.getElementById("viewer").style.display = "flex";
    };

    const caption = document.createElement("p");
    caption.textContent = "PHOTO " + String(index + 1).padStart(2, "0");

    card.appendChild(img);
    card.appendChild(caption);
    gallery.appendChild(card);
});

function closePhoto() {
    document.getElementById("viewer").style.display = "none";
}
</script>

</body>
</html>
